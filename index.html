<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <header class="top-bar">
            <h1>Quiz Master</h1>
            <p>Test Your Knowledge</p>
        </header>

        <main class="home-container">

            <section class="welcome-card">
                <h2>Welcome to Quiz Master!</h2>
                <p>Learn, play and compete with players around the world.</p>

                <button onclick="openLogin()">Login / Sign Up</button>
            </section>

            <section class="menu-grid">

                <div class="menu-card" onclick="openQuiz()">
                    <span>🧠</span>
                    <h3>General Quiz</h3>
                    <p>Play unlimited quizzes</p>
                </div>

                <div class="menu-card" onclick="openCompetition()">
                    <span>🌍</span>
                    <h3>World Competition</h3>
                    <p>Compete with the world</p>
                </div>

                <div class="menu-card" onclick="openLeaderboard()">
                    <span>🏆</span>
                    <h3>Leaderboard</h3>
                    <p>See top players</p>
                </div>

                <div class="menu-card" onclick="openProfile()">
                    <span>👤</span>
                    <h3>Profile</h3>
                    <p>Your statistics & achievements</p>
                </div>

            </section>

        </main>

        <footer>
            <p>© 2026 Quiz Master</p>
        </footer>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
